name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node test.cjs && node data-test.cjs && node cloud-test.cjs && node scenario-test.cjs && node summary-test.cjs && node broker-test.cjs && node capacity-test.cjs && node readiness-test.cjs
      - run: node --check dist/app.js && node --check dist/cloud.js && node --check dist/data.js && node --check dist/history.js
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node test.cjs && node data-test.cjs && node cloud-test.cjs && node scenario-test.cjs && node summary-test.cjs && node broker-test.cjs && node capacity-test.cjs && node readiness-test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
